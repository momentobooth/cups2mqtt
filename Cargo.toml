[package]
name = "cups2mqtt"
version = "0.3.4"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
ipp = { version = "7.0.0", features = ["async-client-tls", "serde"]}
rumqttc = "0.25.1"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.150"
chrono = "0.4.44"
sentry = "0.49.1"
config = "0.15.23"
dotenv-flow = "0.16.2"
url = "2.5.8"
backon = "1.6.0"
log = "0.4.31"
colog = "1.4.0"
rustls-native-certs = "0.8.4"
convert_case = "0.12.0"
dashmap = "6.2.1"
snafu = "0.9.1"
humantime = "2.3.0"
tokio = { version = "1.52.3", features = ["full"] }
croner = "3.0.1"
ron = "0.12.1"
