[package]
name = "cups2mqtt"
version = "0.3.4"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ipp = { version = "7.0.0", features = ["async-client-tls", "serde"]}
rumqttc = "0.25.1"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
chrono = "0.4.45"
sentry = "0.49.2"
config = "0.15.25"
dotenv-flow = "0.16.2"
url = "2.5.8"
backon = "1.6.0"
log = "0.4.34"
colog = "1.4.0"
rustls-native-certs = "0.8.4"
convert_case = "0.12.0"
dashmap = "6.2.1"
snafu = "0.9.2"
humantime = "2.4.0"
tokio = { version = "1.53.1", features = ["full"] }
croner = "4.0.0"
ron = "0.12.2"
